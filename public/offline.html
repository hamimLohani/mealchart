<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .offline-card {
        max-width: 420px;
        width: 100%;
        margin: 1rem;
        padding: 2rem;
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.14);
        background: white;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 4vw, 2.5rem);
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.7;
        color: #334155;
      }

      a {
        display: inline-block;
        padding: 0.9rem 1.5rem;
        border-radius: 9999px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <h1>You are offline</h1>
      <p>Meal Chart cannot load new content without a connection. Try again after reconnecting.</p>
      <a href="/">Go back home</a>
    </main>
  </body>
</html>
